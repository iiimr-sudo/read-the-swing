<!DOCTYPE html>

<style>
/* VOICE a training game with an android-menu calm: quiet, exact, rewarding
   IDEA a field-unit terminal in warm parchment grey, menus that invert when selected
   PICTURE the two chart panes and the chapter roadmap
   COLOUR fixed palette: parchment #d9d2b8, ink #4e4b42, gold lines, rust for misses, olive for hits

   LAYOUT one column, phone first: status strip, screen, drill card; overlays slide in */
:root{color-scheme:light;--bg:#d9d2b8;--ink:#4e4b42;--mut:#7c7767;--pane:#cdc6aa;--card:#d2cbb0;--line:rgba(78,75,66,.35);--gold:#e0ad25;--rust:#a8473c;--olive:#56703e;--inv:#e8e2cb}
*{box-sizing:border-box;min-width:0}

body{background-image:repeating-linear-gradient(0deg,rgba(78,75,66,.035) 0 1px,transparent 1px 4px),radial-gradient(120% 80% at 50% 0%,#e2dcc4 0,var(--bg) 60%);min-height:100vh}
.app{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(48px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
html{-webkit-text-size-adjust:100%}button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3,.cap{font-family:"Saira Semi Condensed","Avenir Next Condensed","Helvetica Neue",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.rule{display:flex;align-items:center;gap:8px;margin:6px 0 12px}.rule::before,.rule::after{content:"";width:6px;height:6px;background:var(--ink)}.rule i{flex:1;height:1px;background:var(--line)}
.status{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;background:var(--ink);color:var(--inv);box-shadow:4px 4px 0 rgba(78,75,66,.25)}
.status .lv{font:600 15px "Saira Semi Condensed","Avenir Next Condensed","Helvetica Neue",sans-serif;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.status .xpb{height:6px;background:rgba(232,226,203,.25);position:relative}.status .xpb i{position:absolute;inset:0 auto 0 0;background:var(--inv);transition:width .6s ease}
.status .xpt{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.status .combo{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;letter-spacing:.06em}.status .combo span{white-space:nowrap}
.status .combo b{font-weight:600}
.status .combo{align-items:center}.sbs{margin-left:auto;display:flex;gap:6px}.sb{background:transparent;border:1px solid var(--inv);color:var(--inv);font:600 12px "Saira Semi Condensed","Avenir Next Condensed","Helvetica Neue",sans-serif;letter-spacing:.14em;text-transform:uppercase;min-height:32px;padding:0 10px;cursor:pointer}.sb[aria-pressed=false]{opacity:.55}

.btn{position:relative;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 14px "Saira Semi Condensed","Avenir Next Condensed","Helvetica Neue",sans-serif;letter-spacing:.12em;text-transform:uppercase;min-height:44px;padding:0 14px 0 26px;cursor:pointer;text-align:left}
.btn::before{content:"";position:absolute;left:10px;top:50%;width:7px;height:7px;margin-top:-3.5px;background:var(--ink)}
.btn:hover,.btn[aria-pressed=true]{background:var(--ink);color:var(--inv)}
.btn:hover::before,.btn[aria-pressed=true]::before{background:var(--inv)}
.btn.wide{width:100%;min-height:52px;font-size:16px}
.btn:disabled{opacity:.4;cursor:default}.btn:disabled:hover{background:transparent;color:var(--ink)}.btn:disabled:hover::before{background:var(--ink)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);box-shadow:4px 4px 0 rgba(78,75,66,.18);padding:12px;margin-bottom:12px;position:relative}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--ink)}
.panel::before{top:-3px;left:-3px;border-right:0;border-bottom:0}.panel::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 6px}

.fig{position:relative;height:clamp(165px,26vh,240px)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.grid.five .btn{padding:4px 1px;text-align:center;font-size:11px;letter-spacing:0;min-height:40px}.grid.five .btn::before{display:none}.grid.three5{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid .btn{padding:6px 8px 6px 24px;font-size:13.5px;letter-spacing:.06em;line-height:1.2}

.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold);left:80%}

.node.done::before{background:var(--ink)}.node.cur::before{background:var(--gold);border-color:var(--ink);box-shadow:0 0 0 3px rgba(224,173,37,.35)}
.node.lock{opacity:.5;cursor:default}
.node:not(.lock):hover{background:var(--ink);color:var(--inv)}.node:not(.lock):hover .sk span{color:var(--inv)}
.node .nt{display:flex;justify-content:space-between;gap:8px;font:600 15px "Saira Semi Condensed","Avenir Next Condensed","Helvetica Neue",sans-serif;letter-spacing:.12em;text-transform:uppercase}

table{width:100%;border-collapse:collapse;font-size:14px}th{font:600 12.5px "Saira Semi Condensed","Avenir Next Condensed","Helvetica Neue",sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:var(--mut);border-bottom:1px solid var(--ink);padding:4px 6px}td{border-bottom:1px solid var(--line);padding:6px;vertical-align:middle}td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.btn.file{position:relative;cursor:pointer;display:flex;align-items:center}.btn.file input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.lookup .lkrow{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:6px;margin:0 0 6px}.lookup .lkl{font:600 13px 'Saira Semi Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}.lkopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.lkopts .btn{min-height:40px;font-size:12px;padding:0 4px;justify-content:center;text-align:center;letter-spacing:.04em}.lkopts .btn::before{display:none}.lookup label{font:600 14px 'Saira Semi Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}

.btn.lklink{display:inline-flex;min-height:28px;padding:0 8px;font-size:12px;margin-left:4px;vertical-align:middle}.btn.lklink::before{display:none}

.rdbox{position:absolute;display:none;border:2px dashed var(--gold);background:rgba(224,173,37,.15);pointer-events:none}
.rdpics{position:relative}
.rdlean{position:absolute;top:14px;right:14px;z-index:2;width:30%;max-width:150px;background:rgba(30,29,25,.86);color:#e8e2cf;border:1px solid rgba(232,226,207,.35);padding:8px 10px 9px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;backdrop-filter:blur(2px)}

.jre{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}.jrth img{width:92px;height:auto;display:block;border:1px solid var(--line)}
.jre .seg .btn{padding:8px 6px;font-size:13px}.lnk{background:none;border:0;padding:0 0 0 6px;color:var(--ink);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer}.lnk.del{display:block;padding:6px 0 0;color:var(--mut)}

/* every judged answer */
function judge(ok,el,k){
 if(ok){CHAIN++;SFX.chain(CHAIN);burst(el,CHAIN);if(CHAIN>=3)popAt(el,`Chain ${CHAIN}`,'chain');
  const q=QUICK[k];if(q&&STEP_T0){const dt=(performance.now()-STEP_T0)/1000,b=dt<=q[0]?10:dt<=q[1]?5:0;if(b){setTimeout(()=>SFX.quick(),140);award(b,el,dt<=q[0]?'Sharp read':'Quick read');ev('quick')}}
  ev('chain',CHAIN)}
 else{if(CHAIN>=4){popAt(el,`Chain broken at ${CHAIN}`,'brk');SFX.brk()}else SFX.miss();CHAIN=0;shake();MUSIC.dip()}
 STEP_T0=0;musicLevel()}

   return `<p class="m"><b>${it.t==='hi'?'Highs':'Lows'} ${it.P.i+1} → ${it.P.j+1}</b> · ${st} · price ${WORD[it.pk].toLowerCase()}, CVD ${WORD[it.ck].toLowerCase()}: ${it.form}${it.form.toLowerCase().includes(CAT[it.cat].n.toLowerCase())?'':', '+CAT[it.cat].n.toLowerCase()}</p>`}).join('');

   ${meterFor('SPOT',CUR!=='free'&&CH[CUR].need==='hard')}<p class="m">To pass: find at least 70% of the pairs and read at least 80% of those right. Dashed: the ones you missed.</p>${rows}
   <div class="grid two"><button class="btn" id="road">Roadmap</button><button class="btn" id="next">Next round</button></div></div>`;return}
 let head;if(R.kind==='scen')head=perfect?'Scenario passed':'Scenario missed';
 else if(last.q==='struct'){const z=res.sc&&res.sc[0];head=z&&z.oH&&z.oL&&z.oN?(last.read.cat!=='none'?last.read.name:'All three right'):`${[z&&z.oH,z&&z.oL,z&&z.oN].filter(Boolean).length} of 3 right`}
 else if(last.q==='seq')head=perfect?'Every line right':`${res.seqOk.filter(Boolean).length} of ${res.seqOk.length} right`;
 else if(res.cats[0])head=res.cats[0].ok?CAT[last.items[0].cat].n:`It was ${CAT[last.items[0].cat].n.toLowerCase()}`;
 else if(Object.keys(res.names).length)head=perfect?'Both named':'Not quite';else head=perfect?'Swings found':'Missed a swing';
 const pt=(v,l)=>v===undefined?'':`<span class="pt ${v?'ok':'no'}">${l}: ${v?'hit':'miss'}</span>`;
 const stageBlocks=R.stages.map((sg,i)=>{const r=res.st[i]||{};
  let body=sg.items.map((it,n)=>itemText(it,n,sg.q)).join('');
  if(sg.q==='struct'){const H=sg.items.find(x=>x.t==='hi'),L=sg.items.find(x=>x.t==='lo'),lw2=v=>v>0?'leans up':v<0?'leans down':'no lean',ext=sg.rec==='hi'?'highs':'lows';
   const named=sg.read.cat!=='none'?`<b>As a structure: ${sg.read.name}.</b> ${sg.read.why} `:'<b>As a structure: no single named form.</b> ';
   const dis=`Line by line they disagree: the highs are ${lc2(CAT[H.cat].n)} (${lw2(H.lean)}), the lows ${lc2(CAT[L.cat].n)} (${lw2(L.lean)}).`;
   const how=sg.conflict?(sg.by==='newdiv'?`${dis} Both extremes show effort and result coming apart, in opposite directions. The newer one, at the ${ext}, is the extreme being tested now; the older one is already answered. The newer one decides: overall it ${lw2(sg.lean)}.`:sg.by==='form'?`${dis} Read as one structure, the named form decides: overall it ${lw2(sg.lean)}.`:sg.by==='div'?`${dis} Only the ${sg.divT==='hi'?'highs':'lows'} show effort and result coming apart, and the extreme where price is failing decides: overall it ${lw2(sg.lean)}.`:`${dis} The most recent swing is at the ${ext}, so it's the one being tested now and it leads: overall it ${lw2(sg.lean)}.`)
    :`Highs ${lc2(CAT[H.cat].n)} (${lw2(H.lean)}), lows ${lc2(CAT[L.cat].n)} (${lw2(L.lean)}): overall it ${lw2(sg.lean)}.`;
   body+=`<p>${named}${how}</p>`}
  else if(sg.q==='single')body+=`<p>${sg.items[0].read}</p>`;
  if(sg.q==='single'&&sg.items[0].P.rj){const it=sg.items[0],L=it.P.rj[1]-it.P.rj[0]+1,hi=it.t==='hi',ex=hi?'high':'low',
   dsc=k=>{const r=SGN[k];return r===0?`kept printing the same ${ex}`:r>0?`ground ${hi?'up':'down'} through the old ${ex} to a new one at the end`:`${hi?'topped':'bottomed'} early and ${hi?'faded':'lifted'} from there`};
   body+=`<p class="m">This ${ex} formed over ${L} candles, not one (the gold box). Across them, price ${dsc(it.pk)} while CVD ${dsc(it.ck)}. ${it.cat==='abs'?'That is absorption happening across the whole cluster: the effort keeps going in and price stays capped.':it.cat==='exh'?'The push kept going on price while the effort behind it faded across the cluster.':it.cat==='cont'?'Both windows moved together across the cluster.':'Read the whole cluster as one swing.'}</p>`}
  if(show.preview===i){const it=sg.items[0],cid={cont:'cont',abs:'abs',exh:'exh',thin:'thinbal',bal:'thinbal'}[it.cat],ci=CH.findIndex(c=>c.id===cid);
   body=`<div class="preview"><div class="lab">Preview · ${CAT[it.cat].n}</div><p>Price made ${WORD[it.pk].toLowerCase()}, CVD made ${WORD[it.ck].toLowerCase()}. ${CAT[it.cat].why}</p>${ci>=0?`<p class="m">You'll learn to read it in chapter ${String(ci+1).padStart(2,'0')}, ${CH[ci].t}.</p>`:''}</div>`+body}
  return `${R.stages.length>1?`<div class="lab">Stage ${i+1} · ${stageOk(i)?'cleared':'missed'}</div>`:''}<div class="pts">${pt(r.mark,'Lines')}${pt(r.name,'Names')}${pt(r.cat,'Read')}${pt(r.seq,'All lines')}${pt(r.ctx,'Timing')}${pt(r.next,'Next move')}</div>${misses(i)}${body}`}).join('');
 let ctx='';if(res.ctx!==undefined){const sg=R.stages.find(x=>x.trend!==undefined&&(x.q==='struct'?x.items.some(i=>i.cat==='abs'):x.items[0].cat==='abs'))||last,lean=sg.q==='struct'?sg.lean:sg.items[0].lean,w=sg.trend===lean;
  ctx=`<p class="m">B and C on the charts are where each entry would have been.</p><p>${w?'The trend is behind the absorption, so the B is fair: with the trend is where it worked for us (20 Nov 11:12, B +231).':'The trend runs against it, so wait for the trend-level C: against the trend it failed every time we logged it without one.'}</p>`}
 const skills=CUR==='free'?[...new Set(R.stages.flatMap(sg=>sg.q==='struct'?['STRUCT']:sg.items.map(i=>i.cat)))].filter(k=>SK[k]):CH[CUR].sk;const hardCh=CUR!=='free'&&CH[CUR].need==='hard';
 el.innerHTML=`<div class="fb flash"><p class="verdict ${perfect?'ok':'no'}">${head}</p>
  <div class="pts"><span class="pt xp">+${res.gained} XP</span>${perfect?`<span class="pt xp">Perfect · streak ${S.streak}</span>`:''}</div>
  ${skills.map(k=>meterFor(k,hardCh)).join('')}
  ${stageBlocks}
  ${last.q==='single'&&res.cats[R.stages.length-1]?`<p class="m">${CAT[last.items[0].cat].why}</p>`:''}${ctx}
  ${res.nx&&res.nx[R.stages.length-1]?`<p class="m">${res.call}</p><p class="m">The dimmed candles play out the read two times in three. That ratio is a placeholder, not a measured statistic: it gets replaced by real odds once the back-study tallies outcomes per form.</p>`:R.ghost?'<p class="m">Dimmed candles: how it played out.</p>':''}
  <div class="grid two"><button class="btn" id="road">Roadmap</button><button class="btn" id="next">Next round</button></div></div>`}

/* ---------- overlays ---------- */
function overlay(html,after){$('#ovc').innerHTML=html;$('#ov').hidden=false;after&&after()}
function closeOv(){$('#ov').hidden=true}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'){closeOv();runQueue()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden){closeOv();runQueue()}});
function runQueue(){if(!$('#ov').hidden)return;const q=QUEUE.shift();if(!q)return;
 if(q.kind==='skill'){const s=status(q.k,q.hard);SFX.prof();
  overlay(`<span class="tag">${q.lvl===3?'Mastery confirmed':'Proficiency acquired'}</span><h2>${SK[q.k]}${q.hard?' (hard)':''}</h2><div class="stamp">${LVN[q.lvl]}</div>
  <p>${q.lvl===3?`${s.l30} right in your last 30. You read this one without thinking now.`:`You're now proficient at ${phr(q.k)}: ${s.l15} right in your last 15.`}</p>
  <button class="btn wide" id="ok">Continue</button>`,()=>{$('#ok').onclick=()=>{closeOv();runQueue()}})}
 else{const i=CH.indexOf(q.c),nx=CH[i+1];SFX.chapter();
  overlay(`<span class="tag">Chapter cleared</span><h2>${String(i+1).padStart(2,'0')} ${q.c.t}</h2><div class="stamp">Complete</div>
  <p>${nx?`Unlocked: ${String(i+2).padStart(2,'0')} ${nx.t}. ${nx.d}`:'Every chapter is cleared. Free play is the endless training ground now.'}</p>
  <div class="grid two"><button class="btn" id="stay">Keep practising</button><button class="btn" id="nx">${nx?'Next chapter':'Roadmap'}</button></div>`,
  ()=>{$('#stay').onclick=()=>{closeOv();runQueue()};$('#nx').onclick=()=>{closeOv();QUEUE=[];nx?play(i+1):setTab('road')}})}}

function boot(d){load(d);hud();sndUI();setTab('road')}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});

}
</script>

 if(old&&old!==APPV)setTimeout(()=>{try{toast('Updated','New version loaded · your progress is kept','',()=>SFX.place())}catch(e){}},1200)})();

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

 const app=document.querySelector('.app');app&&app.prepend(b)})();
